# Deploy automático no Netlify a cada push na branch principal.
# Configure em GitHub: Settings → Secrets → Actions:
#   NETLIFY_AUTH_TOKEN  (Netlify → User settings → Applications → Personal access tokens)
#   NETLIFY_SITE_ID     (Netlify → Site settings → General → Site ID)

name: Deploy Netlify

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Atualizar versão de cache (?v=)
        run: npm run bump-cache

      - name: Deploy produção Netlify
        run: npx netlify-cli deploy --prod --dir . --message "Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
