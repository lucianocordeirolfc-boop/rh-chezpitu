# Deploy automático no Netlify a cada push na branch principal.
# Configure em GitHub: Settings → Secrets → Actions:
#   NETLIFY_AUTH_TOKEN  (Netlify → User settings → Applications → Personal access tokens)
#   NETLIFY_SITE_ID     (Netlify → Site settings → General → Site ID)

name: Deploy Netlify

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Atualizar versão de cache (?v=)
        run: npm run bump-cache

      - name: Deploy produção Netlify
        uses: nwtgck/actions-netlify-deploy@v3.0
        with:
          publish-dir: .
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
