<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sistema de Gestão de Pessoal — Grupo Chez Pitu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css?v=20260829.01" />
  <link rel="stylesheet" href="css/funcionarios.css?v=20260829.01" />
  <link rel="stylesheet" href="css/ausencias.css?v=20260829.01" />
  <link rel="stylesheet" href="css/print.css?v=20260829.01" />
  <link rel="stylesheet" href="css/escala-print.css?v=20260829.01" />
</head>

<body>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <span class="login-brand">CP</span>
      <h1>Grupo Chez Pitu</h1>
      <p class="login-subtitle">Sistema de Gestão de Pessoal</p>

      <form id="loginForm" class="login-form" autocomplete="on">
        <label>
          E-mail
          <input id="loginEmail" type="email" name="email" required autocomplete="username" placeholder="usuario@chezpitu.com">
        </label>
        <label>
          Senha
          <input id="loginPassword" type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button id="loginButton" class="primary" type="submit">Entrar</button>
        <p id="loginError" class="login-error" style="display:none"></p>
      </form>

      <p class="login-footer">Acesso restrito a usuários autorizados.</p>
    </div>
  </div>

  <!-- APLICAÇÃO -->
  <div class="app-shell" style="display:none">

    <!-- TOPO: marca + abas de empresa + ações -->
    <header class="topbar">

      <div class="brand">
        <span class="brand-mark">CP</span>
        <div class="brand-text">
          <strong>Grupo Chez Pitu</strong>
          <small>Gestão de Pessoal</small>
        </div>
      </div>

      <div class="company-tabs" role="tablist" aria-label="Empresa ativa">
        <button class="company-tab active" data-company="Chez Pitu" type="button" role="tab">Chez Pitu</button>
        <button class="company-tab" data-company="Pengold" type="button" role="tab">Pengold</button>
      </div>

      <div class="topbar-actions">
        <span id="syncStatus" class="sync-status" data-status="syncing" title="Sincronização">Sincronizando...</span>
        <button id="appVersionBadge" class="app-version-badge" type="button" title="Informações da versão">v…</button>
        <button id="openManual" class="manual-btn" type="button" title="Manual do Usuário">Manual</button>
        <span id="loggedUserLabel" class="logged-user-label"></span>
        <button id="logoutButton" class="logout-btn" type="button" title="Sair do sistema">Sair</button>
      </div>

    </header>

    <!-- MENU HORIZONTAL (estilo planilha) -->
    <nav class="module-ribbon" aria-label="Módulos">
      <button class="ribbon-item" data-module="empresa" type="button">Dados da Empresa</button>
      <button class="ribbon-item active" data-module="dashboard" type="button">Dashboard</button>
      <button class="ribbon-item" data-module="funcionarios" type="button">Cadastro de Funcionários</button>
      <button class="ribbon-item" data-module="escala" type="button">Escala de Folga</button>
      <button class="ribbon-item" data-module="ferias" type="button">Ausências</button>
      <button class="ribbon-item" data-module="vale-transporte" type="button">Recibo de Vale Transporte</button>
      <button class="ribbon-item" data-module="feriados" type="button">Controle de Feriados</button>
      <button class="ribbon-item" data-module="contador" type="button">Informações do Contador</button>
    </nav>

    <!-- CONTEÚDO DOS MÓDULOS -->
    <main class="app-content">
      <section id="empresa" class="module"></section>
      <section id="dashboard" class="module active"></section>
      <section id="funcionarios" class="module"></section>
      <section id="escala" class="module"></section>
      <section id="ferias" class="module"></section>
      <section id="vale-transporte" class="module"></section>
      <section id="feriados" class="module"></section>
      <section id="contador" class="module"></section>
    </main>

  </div>

  <!-- TOAST -->
  <div id="toastContainer" aria-live="polite"></div>

  <!-- TEMPLATE -->
  <template id="emptyStateTemplate">

    <div class="empty-state">
      <strong>Nenhum registro encontrado.</strong>

      <span>
        Cadastre novas informações para começar a usar este módulo.
      </span>
    </div>

  </template>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <!-- JS -->
  <script src="js/version.js?v=20260829.01"></script>

  <script src="js/auth.js?v=20260829.01"></script>

  <script src="js/security-operations.js?v=20260829.01"></script>

  <script src="js/firebase-sync.js?v=20260829.01"></script>

  <script src="js/import-utils.js?v=20260829.01"></script>

  <script src="js/data.js?v=20260829.01"></script>

  <script src="js/company-ui.js?v=20260829.01"></script>

  <script src="js/inactive-employees.js?v=20260829.01"></script>

  <script src="js/empresa.js?v=20260829.01"></script>

  <script src="js/dashboard.js?v=20260829.01"></script>

  <script src="js/funcionarios.js?v=20260829.01"></script>

  <script src="js/scale-rules.js?v=20260829.01"></script>

  <script src="js/escala.js?v=20260829.01"></script>

  <script src="js/ferias.js?v=20260829.01"></script>

  <script src="js/feriados.js?v=20260829.01"></script>

  <script src="js/manual.js?v=20260829.01"></script>

  <script src="js/vale-transporte.js?v=20260829.01"></script>

  <script src="js/contador.js?v=20260829.01"></script>

  <script src="js/app.js?v=20260829.01"></script>

</body>
</html>
